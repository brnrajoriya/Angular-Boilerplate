<mat-card class="auth-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Create account</mat-card-title>
    <mat-card-subtitle>It only takes a minute.</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formRoot]="form" class="stack">
      <mat-form-field>
        <mat-label>Name</mat-label>
        <mat-icon matPrefix>person</mat-icon>
        <input matInput autocomplete="name" [formField]="form.name" />
        <mat-error><app-field-error [field]="form.name" /></mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>mail</mat-icon>
        <input matInput type="email" autocomplete="email" [formField]="form.email" />
        <mat-error><app-field-error [field]="form.email" /></mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput type="password" autocomplete="new-password" [formField]="form.password" />
        <mat-error><app-field-error [field]="form.password" /></mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Confirm password</mat-label>
        <mat-icon matPrefix>lock_reset</mat-icon>
        <input
          matInput
          type="password"
          autocomplete="new-password"
          [formField]="form.confirmPassword"
        />
        <mat-error><app-field-error [field]="form.confirmPassword" /></mat-error>
      </mat-form-field>

      @if (error(); as message) {
        <p class="form-error" role="alert">{{ message }}</p>
      }

      <button mat-flat-button type="submit" [disabled]="form().submitting()">
        {{ form().submitting() ? 'Creating account...' : 'Register' }}
      </button>

      <div class="auth-links">
        <span>Already registered? <a routerLink="/login">Login</a></span>
      </div>
    </form>
  </mat-card-content>
</mat-card>
