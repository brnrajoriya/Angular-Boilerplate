<mat-card class="auth-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Forgot password?</mat-card-title>
    <mat-card-subtitle>We will email you a reset link.</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (sentMessage(); as message) {
      <div class="stack">
        <div class="info-box" role="status">
          <mat-icon>mark_email_read</mat-icon>
          <span>{{ message }}</span>
        </div>
        <a mat-flat-button routerLink="/login">Back to login</a>
      </div>
    } @else {
      <form [formRoot]="form" class="stack">
        <mat-form-field>
          <mat-label>Email</mat-label>
          <mat-icon matPrefix>mail</mat-icon>
          <input matInput type="email" autocomplete="email" [formField]="form.email" />
          <mat-error><app-field-error [field]="form.email" /></mat-error>
        </mat-form-field>

        @if (error(); as message) {
          <p class="form-error" role="alert">{{ message }}</p>
        }

        <button mat-flat-button type="submit" [disabled]="form().submitting()">
          {{ form().submitting() ? 'Sending...' : 'Send reset link' }}
        </button>

        <div class="auth-links">
          <a routerLink="/login">Back to login</a>
        </div>
      </form>
    }
  </mat-card-content>
</mat-card>
